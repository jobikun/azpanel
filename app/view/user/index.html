{include file="../app/view/user/header.html" title="用户中心" /}

<main class="az-main">
    <div class="az-page-head">
        <div>
            <h1 class="az-page-title">用户中心</h1>
            <p class="az-page-subtitle">公告、账户和虚拟机管理入口。</p>
        </div>
    </div>

    <div class="mdui-row az-section">
        {volist id="ann" name="anns"}
        <div class="mdui-col-md-6 mdui-col-sm-12 mdui-m-t-2">
            <div class="mdui-card">
                <div class="mdui-card-content">
                    <p class="mdui-float-right az-page-subtitle">#{$ann.id}</p>
                    <h2 style="margin: 0; color: #0f172a; font-size: 20px">{$ann.title}</h2>
                    <p class="az-page-subtitle">{:date('Y-m-d H:i:s', $ann.created_at)}</p>
                    <div class="mdui-typo">
                        <p>{$ann.content | raw}</p>
                    </div>
                </div>
            </div>
        </div>
        {/volist}
    </div>
</main>

</body>
{include file="../app/view/user/footer.html" /}

</html>
