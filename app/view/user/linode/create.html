{include file="../app/view/user/header.html" title="添加 Linode 账户" /}

<main class="az-main az-cloud-page az-provider-linode">
    <div class="az-page-head">
        <div class="az-page-heading">
            <span class="az-provider-icon"><i class="mdui-icon material-icons">person_add</i></span>
            <div>
                <p class="az-page-kicker">Akamai Cloud / Linode</p>
                <h1 class="az-page-title">添加 Linode 账户</h1>
                <p class="az-page-subtitle">使用 Personal Access Token 接入账户。</p>
            </div>
        </div>
    </div>

    <div class="mdui-card az-form-card" style="overflow: visible">
        <div class="mdui-card-content mdui-container">
            <div class="mdui-col-sm-12 mdui-col-md-6">
                <div class="mdui-textfield mdui-textfield-floating-label">
                    <i class="mdui-icon material-icons">bookmark</i>
                    <label class="mdui-textfield-label">名称</label>
                    <input class="mdui-textfield-input" id="label">
                </div>
            </div>
            <div class="mdui-col-sm-12 mdui-col-md-6">
                <div class="mdui-textfield mdui-textfield-floating-label">
                    <i class="mdui-icon material-icons">vpn_key</i>
                    <label class="mdui-textfield-label">Token</label>
                    <input class="mdui-textfield-input" id="token">
                </div>
            </div>
            <div class="mdui-col-sm-12">
                <div class="mdui-textfield mdui-textfield-floating-label">
                    <i class="mdui-icon material-icons">notes</i>
                    <label class="mdui-textfield-label">备注</label>
                    <input class="mdui-textfield-input" id="mark">
                </div>
            </div>
            <div class="mdui-col-sm-12 mdui-m-t-2">
                <label class="az-field"><span class="az-field-label">账户默认代理（之后可在账户列表更换）</span><select id="proxy_mode" class="az-native-select">
                    <option value="none">不使用代理</option>
                    <option value="default">使用默认代理池</option>
                    {volist name="proxies" id="proxy"}
                    <option value="pool:{$proxy.id}">{$proxy.name} - [{:strtoupper($proxy.protocol)}{if $proxy.source_type == 'api'} API{/if}] {if $proxy.source_type == 'api'}API{else /}{$proxy.address}:{$proxy.port}{/if}{if $proxy.is_default == 1}（默认）{/if}</option>
                    {/volist}
                </select></label>
            </div>
        </div>
        <div class="az-form-actions"><a class="mdui-btn az-btn-secondary mdui-ripple" href="/user/linode">取消</a><button id="save" class="mdui-btn mdui-btn-raised mdui-color-indigo mdui-ripple">保存账户</button></div>
    </div>
</main>
</body>

<script>
    function proxyRequestData(extra) {
        var mode = $('#proxy_mode').val() || 'none';
        var data = extra || {};
        data.proxy_mode = mode;
        data.proxy_id = mode.indexOf('pool:') === 0 ? mode.replace('pool:', '') : 0;
        return data;
    }

    $('#save').on('click', function () {
        $.ajax({
            method: 'POST',
            url: '/user/linode',
            data: proxyRequestData({
                label: $('#label').val(),
                token: $('#token').val(),
                mark: $('#mark').val(),
            }),
            dataType: 'json',
            success: function (data) {
                mdui.alert(data.content, data.title);
                if (data.status == '1') {
                    setTimeout("window.location = '/user/linode'", 1000);
                }
            }
        });
    });
</script>
{include file="../app/view/user/footer.html" /}

</html>
