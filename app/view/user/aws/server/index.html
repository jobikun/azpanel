{include file="../app/view/user/header.html" title="AWS 虚拟机列表" /}

<main class="az-main">
    <div class="az-page-head">
        <div>
            <h1 class="az-page-title">AWS 虚拟机</h1>
            <p class="az-page-subtitle">按账号和区域加载 EC2 实例，批量启动、停止或重启。</p>
        </div>
        <a class="mdui-btn mdui-btn-raised mdui-color-indigo mdui-ripple" href="/user/server/aws/create">
            <i class="mdui-icon material-icons">add</i>&nbsp;创建虚拟机
        </a>
    </div>

            <!-- <div class="mdui-typo">
                <p>你可以在这里查看 AWS 账户下每个区域的虚拟机</p>
            </div> -->

            <div class="mdui-rows">
                <div class="mdui-col-sm-12 mdui-col-md-4">
                    <div class="mdui-m-t-2">
                        归属：<select id="account" class="mdui-select" mdui-select>
                            {volist name="accounts" id="account"}
                            <option value="{$account->id}">{$account->email}</option>
                            {/volist}
                        </select>
                    </div>
                </div>
                <div class="mdui-col-sm-12 mdui-col-md-4">
                    <div class="mdui-m-t-2">
                        地区：<select id="location" class="mdui-select" mdui-select>
                            {volist name="locations" id="location"}
                            <option value="{$key}">{$location}</option>
                            {/volist}
                        </select>
                    </div>
                </div>
                <div class="mdui-col-sm-12 mdui-col-md-4">
                    <div class="mdui-m-t-2">
                        状态：<select id="status" class="mdui-select" mdui-select>
                            <option value="all">所有</option>
                            <option value="running">仅运行</option>
                        </select>
                    </div>
                </div>
            </div>
            <button id="view"
                class="mdui-m-t-2 mdui-btn mdui-btn-raised mdui-btn-dense mdui-ripple mdui-color-blue-grey">
                <i class="mdui-icon material-icons" style="color:white;">file_download</i>&nbsp;载入表格
            </button>
            <button id="startInstances"
                class="mdui-m-t-2 mdui-btn mdui-btn-raised mdui-btn-dense mdui-ripple mdui-color-blue-grey">
                <i class="mdui-icon material-icons" style="color:white;">power_settings_new</i>&nbsp;启动
            </button>
            <button id="stopInstances"
                class="mdui-m-t-2 mdui-btn mdui-btn-raised mdui-btn-dense mdui-ripple mdui-color-blue-grey">
                <i class="mdui-icon material-icons" style="color:white;">flash_off</i>&nbsp;停止
            </button>
            <button id="rebootInstances"
                class="mdui-m-t-2 mdui-btn mdui-btn-raised mdui-btn-dense mdui-ripple mdui-color-blue-grey">
                <i class="mdui-icon material-icons" style="color:white;">refresh</i>&nbsp;重启
            </button>
            <button id="terminateInstances"
                class="mdui-m-t-2 mdui-btn mdui-btn-raised mdui-btn-dense mdui-ripple mdui-color-blue-grey">
                <i class="mdui-icon material-icons" style="color:white;">delete_forever</i>&nbsp;销毁
            </button>
            <button id="releaseUnusedIps"
                class="mdui-m-t-2 mdui-btn mdui-btn-raised mdui-btn-dense mdui-ripple mdui-color-blue-grey">
                <i class="mdui-icon material-icons" style="color:white;">cleaning_services</i>&nbsp;释放闲置IP
            </button>
            <div class="mdui-m-t-2"></div>
            <div class="mdui-table-fluid-fixed">
                <table id="list" class="mdui-table mdui-table-selectable" style="border: none;">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>名称</th>
                            <th>规格</th>
                            <th>状态</th>
                            <th>IPv4</th>
                            <th>IPv6</th>
                            <th>类型</th>
                            <th>创建于</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>

            <div class="mdui-m-t-2"></div>
</main>
</body>

<script>
    function markColor() {
        var tds = document.getElementsByTagName('td');
        for (var i = 0; i < tds.length; i++) {
            if (tds[i].textContent.indexOf('running') !== -1) {
                tds[i].style.color = 'green';
            }
            if (tds[i].textContent.indexOf('stopping') !== -1 || tds[i].textContent.indexOf('pending') !== -1 || tds[i].textContent.indexOf('shutting-down') !== -1) {
                tds[i].style.color = 'orange';
            }
            if (tds[i].textContent.indexOf('stopped') !== -1 || tds[i].textContent.indexOf('terminated') !== -1) {
                tds[i].style.color = 'red';
            }
        }
    }

    function getSelectedIds() {
        var set = [];
        $('.mdui-table-row-selected').each(function () {
            var id = $(this).attr('data-id');
            set.push(id);
        });
        return set;
    }

    $('#view').on('click', function (e) {
        // 获取账户
        var status = $('#status').val();
        var account = $('#account').val();
        // 配置格式化时间
        var options = {
            timeZone: "Asia/Shanghai",
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        };
        // ajax请求
        $.ajax({
            method: 'GET',
            url: "/user/server/aws/" + account,
            dataType: "json",
            data: {
                location: $('#location').val(),
            },
            success: function (response) {
                if (response.ret == 0) {
                    return mdui.alert(response.msg)
                }
                // 清空当前的 tbody
                var tbody = $('#list tbody');
                tbody.empty();
                // 生成表格
                var reservations = response.Reservations;
                for (var i = 0; i < reservations.length; i++) {
                    var instances = reservations[i].Instances;
                    for (var j = 0; j < instances.length; j++) {
                        var instance = instances[j];
                        if ((status == 'running' && instance.State.Name == 'running') || status == 'all') {
                            // 时间格式转化
                            var dateObj = new Date(instance.LaunchTime);
                            var formattedDate = dateObj.toLocaleString("zh-CN", options);
                            // 为tr加上实例id
                            var row = $('<tr data-id="' + instance.InstanceId + '"></tr>');
                            // 其他元素
                            row.append($('<td></td>').text(i * instances.length + j + 1));  // 序号
                            row.append($('<td></td>').text(instance.Tags.find(tag => tag.Key === 'Name').Value));  // 虚拟机名称
                            row.append($('<td></td>').text(instance.InstanceType));  // 虚拟机规格
                            row.append($('<td></td>').text(instance.State.Name));  // 虚拟机状态
                            row.append($('<td></td>').text(instance.PublicIpAddress));  // 虚拟机 ipv4 地址
                            var ipv6Addresses = (instance.NetworkInterfaces || [])
                                .flatMap(networkInterface => networkInterface.Ipv6Addresses || [])
                                .map(ipv6 => ipv6.Ipv6Address)
                                .join(', ');
                            row.append($('<td></td>').text(ipv6Addresses));  // 虚拟机 ipv6 地址
                            row.append($('<td></td>').text(instance.PlatformDetails));  // 虚拟机类别
                            row.append($('<td></td>').text(formattedDate));  // 虚拟机创建时间
                            // 操作按钮
                            (function(instId, accId, loc) {
                                var safeId = instId.replace(/[^a-zA-Z0-9_-]/g, '');
                                var btnGroup = $('<div style="display:flex;gap:4px;align-items:center"></div>');
                                var ipv4MenuId = 'aws-ipv4-menu-' + safeId;
                                var ipv6MenuId = 'aws-ipv6-menu-' + safeId;
                                var ipv4Btn = $('<button class="mdui-btn mdui-btn-raised mdui-btn-dense mdui-ripple mdui-color-blue-grey" style="font-size:12px;min-height:28px;line-height:28px" mdui-menu="{target: \'#' + ipv4MenuId + '\'}">IPv4 <i class="mdui-icon material-icons" style="font-size:16px;vertical-align:middle">arrow_drop_down</i></button>');
                                var ipv6Btn = $('<button class="mdui-btn mdui-btn-raised mdui-btn-dense mdui-ripple mdui-color-blue-grey" style="font-size:12px;min-height:28px;line-height:28px" mdui-menu="{target: \'#' + ipv6MenuId + '\'}">IPv6 <i class="mdui-icon material-icons" style="font-size:16px;vertical-align:middle">arrow_drop_down</i></button>');
                                var ipv4Menu = $('<ul class="mdui-menu" id="' + ipv4MenuId + '"><li class="mdui-menu-item"><a href="javascript:void(0)" class="mdui-ripple js-add-ipv4">增加 IPv4</a></li><li class="mdui-menu-item"><a href="javascript:void(0)" class="mdui-ripple js-change-ipv4">更换 IPv4</a></li></ul>');
                                var ipv6Menu = $('<ul class="mdui-menu" id="' + ipv6MenuId + '"><li class="mdui-menu-item"><a href="javascript:void(0)" class="mdui-ripple js-add-ipv6">增加 IPv6</a></li><li class="mdui-menu-item"><a href="javascript:void(0)" class="mdui-ripple js-change-ipv6">更换 IPv6</a></li></ul>');
                                ipv4Menu.find('.js-add-ipv4').on('click', function() {
                                    addAwsIpv4(instId, accId, loc);
                                });
                                ipv4Menu.find('.js-change-ipv4').on('click', function() {
                                    changeAwsIp(instId, accId, loc);
                                });
                                ipv6Menu.find('.js-add-ipv6').on('click', function() {
                                    addAwsIpv6(instId, accId, loc);
                                });
                                ipv6Menu.find('.js-change-ipv6').on('click', function() {
                                    changeAwsIpv6(instId, accId, loc);
                                });
                                btnGroup.append(ipv4Btn, ipv4Menu, ipv6Btn, ipv6Menu);
                                row.append($('<td></td>').append(btnGroup));
                            })(instance.InstanceId, account, $('#location').val());
                            tbody.append(row);
                        }
                    }
                }
                mdui.snackbar({
                    message: '已刷新表格，找到 ' + reservations.length + ' 个虚拟机',
                    position: 'top',
                    timeout: '1000'
                });
                mdui.updateTables();
                mdui.mutation();
                // 标记颜色
                markColor();
            }
        });
    });

    var ids = ['#startInstances', '#stopInstances', '#rebootInstances', '#terminateInstances'];
    var handler = function (event) {
        var account = $('#account').val();
        var instances = getSelectedIds();
        if (instances.length == 0) {
            return mdui.alert('请先勾选一个或多个虚拟机', '操作失败');
        }
        $.ajax({
            method: 'PUT',
            url: "/user/server/aws/" + account,
            dataType: "json",
            data: {
                action: this.id,
                instances: instances,
                location: $('#location').val(),
            },
            success: function (response) {
                if (response.ret == 0) {
                    return mdui.alert(response.msg)
                }
                mdui.snackbar({
                    message: '操作成功',
                    position: 'top',
                    timeout: '1000'
                });
            }
        });
    };
    ids.forEach(function (id) {
        mdui.$(id).on('click', handler);
    });

    function postAwsAddressAction(url, instanceId, accountId, location) {
        $.ajax({
            method: 'POST',
            url: url,
            dataType: "json",
            data: {
                instance_id: instanceId,
                account_id: accountId,
                location: location,
            },
            success: function (data) {
                mdui.alert(data.content, data.title);
            }
        });
    }

    function changeAwsIp(instanceId, accountId, location) {
        mdui.confirm('将为实例 ' + instanceId + ' 更换弹性公网 IPv4 地址（旧地址将被释放）', '更换确认',
            function () {
                postAwsAddressAction("/user/server/aws/changeip", instanceId, accountId, location);
            },
            function () { },
            {
                confirmText: "确定",
                cancelText: "取消",
            }
        );
    }

    function addAwsIpv4(instanceId, accountId, location) {
        mdui.confirm('将为实例 ' + instanceId + ' 增加一个弹性公网 IPv4 地址', '增加确认',
            function () {
                postAwsAddressAction("/user/server/aws/addipv4", instanceId, accountId, location);
            },
            function () { },
            {
                confirmText: "确定",
                cancelText: "取消",
            }
        );
    }

    function addAwsIpv6(instanceId, accountId, location) {
        mdui.confirm('将为实例 ' + instanceId + ' 增加一个公网 IPv6 地址', '增加确认',
            function () {
                postAwsAddressAction("/user/server/aws/addipv6", instanceId, accountId, location);
            },
            function () { },
            {
                confirmText: "确定",
                cancelText: "取消",
            }
        );
    }

    function changeAwsIpv6(instanceId, accountId, location) {
        mdui.confirm('将为实例 ' + instanceId + ' 更换公网 IPv6 地址（旧地址将被解绑）', '更换确认',
            function () {
                postAwsAddressAction("/user/server/aws/changeipv6", instanceId, accountId, location);
            },
            function () { },
            {
                confirmText: "确定",
                cancelText: "取消",
            }
        );
    }

    $('#releaseUnusedIps').on('click', function () {
        var account = $('#account').val();
        var location = $('#location').val();
        if (!account || !location) {
            mdui.alert('请先选择账号和地区');
            return;
        }
        mdui.confirm('将释放【当前区域】下所有未绑定实例的闲置弹性 IPv4，正在使用的不受影响。确定继续？', '释放闲置 IP',
            function () {
                $.ajax({
                    method: 'POST',
                    url: "/user/server/aws/releaseunusedips",
                    dataType: "json",
                    data: {
                        account_id: account,
                        location: location,
                    },
                    success: function (data) {
                        mdui.alert(data.content, data.title);
                    }
                });
            },
            function () { },
            {
                confirmText: "确定",
                cancelText: "取消",
            }
        );
    });
</script>

{include file="../app/view/user/footer.html" /}

</html>
